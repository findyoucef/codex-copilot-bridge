name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  test:
    name: Test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CodexCopilotBridge.slnx

      - name: Format
        run: dotnet format CodexCopilotBridge.slnx --verify-no-changes --no-restore --verbosity minimal

      - name: Test
        run: dotnet test CodexCopilotBridge.slnx --configuration Release --no-restore

      - name: Build
        run: dotnet build CodexCopilotBridge.slnx --configuration Release --no-restore

  publish-osx-arm64:
    name: Publish osx-arm64
    runs-on: macos-15
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: scripts/publish-osx-arm64.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: codex-copilot-bridge-osx-arm64
          path: artifacts/dist/codex-copilot-bridge-osx-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14
